<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capstock</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="wordmark">Cap<span>Stock</span></div>
  <div class="status-pill" id="statusPill">
    <div class="dot"></div>
    <span id="statusText">connecting…</span>
  </div>
</header>

<main>
  <div class="sync-log" id="syncLog"></div>
  <div class="watchlist" id="watchlist"></div>

  <div class="detail" id="detail">
    <div class="detail-empty">Select a ticker to see its trend.</div>
  </div>
</main>

<svg width="0" height="0">
  <defs>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5fa8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff5fa8" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
